---
- hosts: localhost
  connection:
  become: true
  tasks:

  - name: update all packages
    ansible.builtin.apt:
      upgrade: dist
      update_cach: yes
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install apache 2
    ansible.builtin.apt:
      name: apache2
      state: latest
    when: ansible_facts['distribution'] == "Ubuntu"
